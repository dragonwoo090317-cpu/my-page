  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #080711;
      color: #ffffff;
      overflow-x: hidden;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* 별 배경 캔버스 */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 카드 뒤집기 애니메이션 스타일 */
    .perspective-1000 {
      perspective: 1000px;
    }

    .flipper {
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      position: relative;
    }

    .flipper.flipped {
      transform: rotateY(180deg);
    }

    .front, .back {
      backface-visibility: hidden;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 1.25rem;
    }

    .front {
      z-index: 2;
      transform: rotateY(0deg);
    }

    .back {
      transform: rotateY(180deg);
    }

    /* 글로우 효과 및 그라데이션 테두리 */
    .neon-glow {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
    }

    .neon-glow:hover {
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.6), inset 0 0 20px rgba(236, 72, 153, 0.3);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 파티클 효과용 컨테이너 */
    #particles-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    /* 커스텀 애니메이션 */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: blur(20px); }
      50% { opacity: 0.9; filter: blur(30px); }
    }

    .glow-bg {
      animation: pulseGlow 6s infinite ease-in-out;
    }
  </style>
